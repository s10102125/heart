<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暖心橋｜開發者模式</title><link rel="icon" href="./logo.svg"><style>*{box-sizing:border-box}body{margin:0;background:#faf7ef;color:#35463d;font:18px/1.6 system-ui,sans-serif}header{display:flex;align-items:center;gap:12px;padding:16px 5%;background:#fffdf9;border-bottom:1px solid #e6dfd1;flex-wrap:wrap}header img{width:44px}header a{margin-left:auto;color:#365743}main{max-width:1000px;margin:auto;padding:24px}h1,h2{line-height:1.3}button,select,input,textarea{font:inherit;border-radius:12px;padding:12px}button{background:#476c56;color:white;border:0;cursor:pointer;min-height:48px}button.secondary{background:#e9e3d7;color:#35463d}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ad762f;outline-offset:3px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.card{background:#fffdf9;border:1px solid #e6dfd1;border-radius:20px;padding:20px;margin:16px 0}.notice{background:#f1e7d3;padding:16px;border-radius:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e6dfd1;flex-wrap:wrap}label{display:block;margin-top:10px}input,select,textarea{width:100%;border:1px solid #a9b5a6;background:white}textarea{min-height:100px}.muted{font-size:.9em;color:#526356}[hidden]{display:none!important}body.large{font-size:24px}</style></head><body><header><img src="./logo.svg" alt=""><strong>暖心橋・開發者模式</strong><a href="./index.html">離開測試模式</a></header><main><div class="notice"><strong>測試環境｜模擬資料</strong><br>不必登入。此頁與正式 Firebase 完全隔離，請勿輸入真實個資。所有變更只保留於此頁記憶體，重新整理即重置。</div><h1>功能測試工作區</h1><div class="bar"><button id="elder">長者端</button><button id="family" class="secondary">家人端</button><button id="large" class="secondary" aria-pressed="false">放大文字</button><button id="reset" class="secondary">重置測試資料</button></div><p id="status" role="status"></p><section class="card" id="healthDemo"><h2>今日健康任務</h2><p id="progress"></p><div id="tasks"></div></section><section class="card" id="visitsDemo"><h2>就醫紀錄與回診追蹤</h2><div id="visits"></div><form id="visitForm"><label for="hospital">模擬院所</label><input id="hospital" required maxlength="60" value="示範診所"><label for="result">模擬就醫摘要</label><textarea id="result" required maxlength="300" placeholder="僅輸入虛構內容"></textarea><label for="next">下次回診</label><input id="next" type="date"><label><input id="shared" type="checkbox" style="width:auto"> 分享給模擬家人</label><button>新增模擬就醫紀錄</button></form></section><section class="card" id="proxyDemo" hidden><h2>代理照護</h2><div id="profiles"></div><form id="proxyForm"><label for="name">虛構照護對象稱呼</label><input id="name" maxlength="40" required><label for="relation">家庭關係</label><select id="relation"><option>父親</option><option>母親</option><option>其他</option></select><button>建立模擬檔案</button></form><form id="recordForm"><label for="profile">選擇照護對象</label><select id="profile" required></select><label for="note">虛構代理紀錄</label><textarea id="note" maxlength="300" required></textarea><button>新增代理紀錄</button></form></section></main><script>
const $=id=>document.getElementById(id);let role='elder',state;
function init(){state={tasks:[{name:'早餐後用藥確認',done:false},{name:'測量血糖',done:false},{name:'回診提醒',done:false}],visits:[{hospital:'示範診所',result:'模擬就醫摘要，非真實醫囑',next:'',shared:true},{hospital:'示範醫院',result:'未分享的模擬紀錄',next:'',shared:false}],profiles:[{name:'示範長者',relation:'母親',records:[]}]};render()}
function row(parent,txt,button,fn){const d=document.createElement('div');d.className='row';const p=document.createElement('span');p.textContent=txt;d.append(p);if(button){const b=document.createElement('button');b.type='button';b.textContent=button;b.onclick=fn;d.append(b)}parent.append(d)}
function render(){const elder=role==='elder';$('elder').className=elder?'':'secondary';$('family').className=elder?'secondary':'';$('elder').setAttribute('aria-pressed',String(elder));$('family').setAttribute('aria-pressed',String(!elder));$('status').textContent=elder?'目前測試：長者端':'目前測試：家人端';$('healthDemo').hidden=!elder;$('proxyDemo').hidden=elder;$('visitForm').hidden=!elder;$('tasks').replaceChildren();state.tasks.forEach(t=>row($('tasks'),t.name,t.done?'取消確認':'已完成',()=>{t.done=!t.done;render()}));$('progress').textContent='已確認 '+state.tasks.filter(t=>t.done).length+' / '+state.tasks.length+' 項';$('visits').replaceChildren();state.visits.filter(v=>elder||v.shared).forEach(v=>row($('visits'),v.hospital+'｜'+v.result+(v.next?'｜下次回診：'+v.next:'')+(elder?(v.shared?'｜已分享':'｜未分享'):''),elder?(v.shared?'停止分享':'分享'):null,()=>{v.shared=!v.shared;render()}));$('profiles').replaceChildren();const selected=$('profile').value;$('profile').replaceChildren();state.profiles.forEach((p,i)=>{row($('profiles'),p.name+'（'+p.relation+'）');p.records.forEach(n=>row($('profiles'),'家人代填：'+n));$('profile').add(new Option(p.name,String(i)))});if([...$('profile').options].some(o=>o.value===selected))$('profile').value=selected}
$('elder').onclick=()=>{role='elder';render()};$('family').onclick=()=>{role='family';render()};$('reset').onclick=()=>{if(confirm('重置所有模擬資料？')){init();$('visitForm').reset();$('proxyForm').reset();$('recordForm').reset()}};$('large').onclick=()=>{const on=document.body.classList.toggle('large');$('large').setAttribute('aria-pressed',String(on));$('large').textContent=on?'恢復文字':'放大文字'};
$('visitForm').onsubmit=e=>{e.preventDefault();if(role!=='elder')return;state.visits.push({hospital:$('hospital').value.trim(),result:$('result').value.trim(),next:$('next').value,shared:$('shared').checked});e.target.reset();render()};$('proxyForm').onsubmit=e=>{e.preventDefault();if(role!=='family')return;state.profiles.push({name:$('name').value.trim(),relation:$('relation').value,records:[]});e.target.reset();render();$('profile').value=String(state.profiles.length-1)};$('recordForm').onsubmit=e=>{e.preventDefault();if(role!=='family')return;const p=state.profiles[Number($('profile').value)];if(p)p.records.push($('note').value.trim());$('note').value='';render()};init();
</script></body></html>
